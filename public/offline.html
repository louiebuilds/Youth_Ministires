<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0369a1" />
    <title>Offline | Youth Ministries Platform</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 32rem);
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #ffffff;
        padding: 2rem;
        box-shadow: 0 0.5rem 1.5rem rgb(15 23 42 / 8%);
        text-align: center;
      }
      img { width: 5rem; height: 5rem; border-radius: 1rem; }
      p { margin: 0.75rem 0 0; color: #475569; line-height: 1.6; }
      .label { color: #0369a1; font-size: 0.875rem; font-weight: 700; }
      h1 { margin: 0.5rem 0 0; font-size: 1.75rem; }
      button {
        min-height: 2.75rem;
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0369a1;
        color: #ffffff;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="" />
      <p class="label">Youth Ministries Platform</p>
      <h1>You’re offline</h1>
      <p>
        Ministry information requires a secure internet connection. Reconnect
        and try again to continue.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
